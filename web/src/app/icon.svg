<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="16" height="16" rx="2" fill="#0d0f14" />

  <!-- Motion arc (︵) -->
  <rect x="6" y="3" width="1" height="1" fill="#f2bf40" />
  <rect x="7" y="2" width="2" height="1" fill="#f2bf40" />
  <rect x="14" y="2" width="1" height="1" fill="#f5efe0" />

  <!-- Upside-down table (┻━┻) -->
  <rect x="10" y="4" width="1" height="3" fill="#a05a2c" />
  <rect x="14" y="4" width="1" height="3" fill="#a05a2c" />
  <rect x="9" y="7" width="6" height="1" fill="#d48942" />
  <rect x="9" y="8" width="6" height="1" fill="#8b4a20" />

  <!-- Flipper character (╯°□°)╯ -->
  <!-- Left raised arm -->
  <rect x="1" y="9" width="1" height="2" fill="#f5efe0" />
  <rect x="2" y="11" width="1" height="1" fill="#f5efe0" />

  <!-- Head -->
  <rect x="3" y="9" width="4" height="6" fill="#f5efe0" />
  <rect x="2" y="10" width="6" height="4" fill="#f5efe0" />

  <!-- Eyes (° °) -->
  <rect x="3" y="10" width="1" height="1" fill="#0d0f14" />
  <rect x="6" y="10" width="1" height="1" fill="#0d0f14" />

  <!-- Shouting mouth (□) -->
  <rect x="4" y="12" width="2" height="2" fill="#ff6b35" />

  <!-- Right throwing arm -->
  <rect x="7" y="8" width="1" height="2" fill="#f5efe0" />
</svg>
